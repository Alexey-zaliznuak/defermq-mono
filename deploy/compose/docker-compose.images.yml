name: defermq

x-defermq-service: &defermq-service
  env_file:
    - path: ../../.env
      required: false
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 25s
  networks:
    - defermq

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-defermq}
      POSTGRES_USER: ${POSTGRES_USER:-defermq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-defermq}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DEFERMQ_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - defermq

  nats:
    image: nats:2.12-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ../../configs/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data/jetstream
    ports:
      - "127.0.0.1:${DEFERMQ_NATS_CLIENT_PORT:-4222}:4222"
      - "127.0.0.1:${DEFERMQ_NATS_MONITORING_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - defermq

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${DEFERMQ_VALKEY_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - defermq

  gateway:
    <<: *defermq-service
    image: ${DEFERMQ_GATEWAY_IMAGE:-registry.example.com/your-project/defermq-gateway:replace-me}
    environment:
      DEFERMQ_SERVICE_NAME: defermq-gateway
      DEFERMQ_GATEWAY_HTTP_ADDR: :8080
    ports:
      - "127.0.0.1:${DEFERMQ_GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres-manager:
    <<: *defermq-service
    image: ${DEFERMQ_POSTGRES_MANAGER_IMAGE:-registry.example.com/your-project/defermq-postgres-manager:replace-me}
    environment:
      DEFERMQ_SERVICE_NAME: defermq-postgres-manager
      DEFERMQ_MANAGER_HTTP_ADDR: :8081
      DEFERMQ_VALKEY_URL: redis://valkey:6379/0
    ports:
      - "127.0.0.1:${DEFERMQ_MANAGER_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  pusher:
    <<: *defermq-service
    image: ${DEFERMQ_PUSHER_IMAGE:-registry.example.com/your-project/defermq-pusher:replace-me}
    environment:
      DEFERMQ_SERVICE_NAME: defermq-pusher
      DEFERMQ_PUSHER_HTTP_ADDR: :8082
    ports:
      - "127.0.0.1:${DEFERMQ_PUSHER_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      postgres-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8082/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  kafka:
    image: apache/kafka:4.1.0
    profiles: ["kafka"]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - defermq

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    profiles: ["rabbit"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEFERMQ_RABBIT_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - defermq

  target-postgres:
    image: postgres:18-alpine
    profiles: ["target-postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TARGET_POSTGRES_DB:-target}
      POSTGRES_USER: ${TARGET_POSTGRES_USER:-target}
      POSTGRES_PASSWORD: ${TARGET_POSTGRES_PASSWORD:-target}
    volumes:
      - target-postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DEFERMQ_TARGET_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - defermq

volumes:
  postgres-data:
  nats-data:
  kafka-data:
  rabbitmq-data:
  target-postgres-data:

networks:
  defermq:
    driver: bridge
