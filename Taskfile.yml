version: "3"

vars:
  GO: '{{default "go" .GO}}'
  BUILD_DIR: '{{default "build" .BUILD_DIR}}'
  VERSION: '{{default "dev" .VERSION}}'
  COMMIT: '{{default "unknown" .COMMIT}}'
  BUILD_TIME: '{{default "unknown" .BUILD_TIME}}'
  LOADTEST_CONFIG: '{{default "configs/loadtest.example.yml" .LOADTEST_CONFIG}}'
  LOADTEST_SMOKE_CONFIG: '{{default "configs/loadtest.smoke.yml" .LOADTEST_SMOKE_CONFIG}}'
  LOADTEST_1000RPS_CONFIG: '{{default "configs/loadtest.1000rps.yml" .LOADTEST_1000RPS_CONFIG}}'
  EXT: '{{if eq OS "windows"}}.exe{{end}}'
  LDFLAGS: >-
    -s -w
    -X github.com/defermq/defermq/internal/buildinfo.Version={{.VERSION}}
    -X github.com/defermq/defermq/internal/buildinfo.Commit={{.COMMIT}}
    -X github.com/defermq/defermq/internal/buildinfo.BuildTime={{.BUILD_TIME}}

tasks:
  default:
    desc: Показать доступные задачи
    cmds:
      - task --list

  deps:
    desc: Загрузить и проверить Go-зависимости
    cmds:
      - '{{.GO}} mod download'
      - '{{.GO}} mod verify'

  fmt:
    desc: Отформатировать Go-код
    cmds:
      - '{{.GO}} fmt ./...'

  vet:
    desc: Запустить go vet
    cmds:
      - '{{.GO}} vet ./...'

  test:
    desc: Запустить unit-тесты
    cmds:
      - '{{.GO}} test ./...'

  test-unit:
    desc: Запустить быстрые unit-тесты без внешних сервисов
    aliases: [unit]
    cmds:
      - '{{.GO}} test ./internal/... ./tools/...'

  test-race:
    desc: Запустить тесты с race detector
    cmds:
      - '{{.GO}} test -race ./...'

  test-integration:
    desc: Запустить opt-in integration-тесты
    cmds:
      - '{{.GO}} test -tags=integration ./...'

  test-core-integration:
    desc: Запустить PostgreSQL и NATS integration tests против Compose
    env:
      DEFERMQ_TEST_POSTGRES_DSN: '{{default "postgres://defermq:defermq@127.0.0.1:55432/defermq?sslmode=disable" .DEFERMQ_TEST_POSTGRES_DSN}}'
      DEFERMQ_NATS_INTEGRATION_URL: '{{default "nats://127.0.0.1:4222" .DEFERMQ_NATS_INTEGRATION_URL}}'
    cmds:
      - '{{.GO}} test -count=1 -timeout=5m ./internal/storage/postgres ./internal/hotstorage/natsjs'

  test-e2e:
    desc: Запустить HTTP E2E против локального Compose
    env:
      DEFERMQ_E2E_GATEWAY_URL: '{{default "http://127.0.0.1:8080" .DEFERMQ_E2E_GATEWAY_URL}}'
      DEFERMQ_E2E_RECEIVER_PUBLIC_HOST: '{{default "host.docker.internal" .DEFERMQ_E2E_RECEIVER_PUBLIC_HOST}}'
    cmds:
      - '{{.GO}} test -count=1 -timeout=5m ./integration'

  load-test:
    desc: Запустить конфигурируемый load/E2E test и сформировать отчёты
    cmds:
      - '{{.GO}} run ./tools/loadtest -config "{{.LOADTEST_CONFIG}}" {{.CLI_ARGS}}'

  load-smoke:
    desc: Запустить короткий smoke load test
    aliases: [smoke]
    cmds:
      - task: load-test
        vars:
          LOADTEST_CONFIG: '{{.LOADTEST_SMOKE_CONFIG}}'

  load-1000rps:
    desc: Запустить двухминутный профиль 1000 create-запросов в секунду
    aliases: [1000rps]
    cmds:
      - task: load-test
        vars:
          LOADTEST_CONFIG: '{{.LOADTEST_1000RPS_CONFIG}}'

  test-fault:
    desc: Проверить окна отказов ingest, Valkey scheduler и ready outbox
    aliases: [fault]
    cmds:
      - '{{.GO}} test -count=1 ./internal/ingest ./internal/manager ./internal/hotstorage/valkey ./internal/hotstorage/natsjs'

  test-full:
    desc: Выполнить unit, race, fault, core integration и HTTP E2E без нагрузки
    aliases: [full]
    cmds:
      - task: test-unit
      - task: test-race
      - task: test-fault
      - task: test-core-integration
      - task: test-e2e

  lint:
    desc: Запустить golangci-lint из PATH
    cmds:
      - golangci-lint run ./...

  prepare-build:
    internal: true
    run: once
    cmds:
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force '{{.BUILD_DIR}}' | Out-Null"
        platforms: [windows]
      - cmd: mkdir -p "{{.BUILD_DIR}}"
        platforms: [linux, darwin]

  build:
    desc: Собрать все три бинаря в build/
    deps: [build-gateway, build-manager, build-pusher]

  build-gateway:
    desc: Собрать defermq-gateway в build/
    deps: [prepare-build]
    cmds:
      - '{{.GO}} build -trimpath -ldflags="{{.LDFLAGS}}" -o "{{.BUILD_DIR}}/defermq-gateway{{.EXT}}" ./cmd/defermq-gateway'

  build-manager:
    desc: Собрать defermq-postgres-manager в build/
    deps: [prepare-build]
    cmds:
      - '{{.GO}} build -trimpath -ldflags="{{.LDFLAGS}}" -o "{{.BUILD_DIR}}/defermq-postgres-manager{{.EXT}}" ./cmd/defermq-postgres-manager'

  build-pusher:
    desc: Собрать defermq-pusher в build/
    deps: [prepare-build]
    cmds:
      - '{{.GO}} build -trimpath -ldflags="{{.LDFLAGS}}" -o "{{.BUILD_DIR}}/defermq-pusher{{.EXT}}" ./cmd/defermq-pusher'

  clean:
    desc: Удалить локальные build artifacts
    cmds:
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force '{{.BUILD_DIR}}' -ErrorAction SilentlyContinue"
        platforms: [windows]
      - cmd: rm -rf "{{.BUILD_DIR}}"
        platforms: [linux, darwin]

  run-gateway:
    desc: Запустить Gateway локально
    cmds:
      - '{{.GO}} run ./cmd/defermq-gateway'

  run-manager:
    desc: Запустить PostgreSQL Manager локально
    cmds:
      - '{{.GO}} run ./cmd/defermq-postgres-manager'

  run-pusher:
    desc: Запустить Pusher локально
    cmds:
      - '{{.GO}} run ./cmd/defermq-pusher'

  compose-build-up:
    desc: Собрать и запустить Compose из исходников
    cmds:
      - docker compose -f deploy/compose/docker-compose.build.yml up --build -d

  compose-images-up:
    desc: Скачать и запустить готовые images
    cmds:
      - docker compose -f deploy/compose/docker-compose.images.yml pull
      - docker compose -f deploy/compose/docker-compose.images.yml up -d

  compose-down:
    desc: Остановить Compose, сохранив volumes
    cmds:
      - docker compose -f deploy/compose/docker-compose.build.yml down --remove-orphans
      - docker compose -f deploy/compose/docker-compose.images.yml down --remove-orphans

  config-check:
    desc: Проверить синтаксис build/images Compose и список Task-команд
    cmds:
      - docker compose -f deploy/compose/docker-compose.build.yml config --quiet
      - docker compose -f deploy/compose/docker-compose.images.yml config --quiet
      - task --list

  migrate-up:
    desc: Применить SQL-миграции утилитой goose
    requires:
      vars: [DEFERMQ_POSTGRES_DSN]
    cmds:
      - goose -dir migrations postgres "{{.DEFERMQ_POSTGRES_DSN}}" up

  migrate-status:
    desc: Показать статус миграций
    requires:
      vars: [DEFERMQ_POSTGRES_DSN]
    cmds:
      - goose -dir migrations postgres "{{.DEFERMQ_POSTGRES_DSN}}" status
