# Локальная конфигурация NATS. Compose публикует client/monitoring ports только
# на loopback; для сетевого deployment обязательно настройте auth и TLS.
server_name: defermq-nats
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 4GB
}

max_payload: 1MB
write_deadline: "10s"
